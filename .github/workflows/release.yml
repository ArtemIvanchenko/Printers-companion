name: Publish release images

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: release-images
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMAGE_REPO: ghcr.io/artemivanchenko/printers-companion
    steps:
      - uses: actions/checkout@v4
      - name: Require the exact source to have passed CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(tr -d '[:space:]' < VERSION)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$GITHUB_REF_NAME" = "v$VERSION"
          gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
            --commit "$GITHUB_SHA" --limit 1 --json conclusion,status \
            --jq '.[0] | select(.status == "completed" and .conclusion == "success") | .conclusion' \
            | grep -qx success
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build all service images before publishing any service tag
        run: |
          set -euo pipefail
          docker build -f Dockerfile.base -t "$IMAGE_REPO:base" .
          docker tag "$IMAGE_REPO:base" "$IMAGE_REPO:base-v$APP_VERSION"
          for service in api worker scheduler watcher mcp; do
            docker build -f "Dockerfile.$service" -t "$IMAGE_REPO:$service-v$APP_VERSION" \
              --build-arg "APP_VERSION=$APP_VERSION" \
              --build-arg "GIT_COMMIT=$GITHUB_SHA" \
              --build-arg "BUILD_DATE=$BUILD_DATE" \
              --build-arg SOURCE_STATE=clean .
            test "$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE_REPO:$service-v$APP_VERSION")" = "$GITHUB_SHA"
          done
      - name: Publish versioned images, then update compatibility aliases
        run: |
          set -euo pipefail
          for service in base api worker scheduler watcher mcp; do
            docker push "$IMAGE_REPO:$service-v$APP_VERSION"
          done
          for service in base api worker scheduler watcher mcp; do
            docker tag "$IMAGE_REPO:$service-v$APP_VERSION" "$IMAGE_REPO:$service"
            docker push "$IMAGE_REPO:$service"
          done
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Capture and verify immutable operator images
        run: python scripts/maintenance/capture_desktop_images.py --context default --output "$RUNNER_TEMP/operator-images.json"
      - uses: actions/upload-artifact@v4
        with:
          name: operator-images
          path: ${{ runner.temp }}/operator-images.json
          if-no-files-found: error

  desktop:
    needs: publish
    uses: ./.github/workflows/desktop.yml
    with:
      images_artifact: operator-images
      signed_release: ${{ vars.COMPANION_SIGNED_RELEASE == 'true' }}
    secrets: inherit

  release:
    needs: [publish, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked collector dependencies without Electron/build tooling
        working-directory: desktop
        run: npm ci --omit=dev --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: companion-${{ vars.COMPANION_SIGNED_RELEASE == 'true' && 'signed' || 'test' }}-*
          path: installers
      - uses: actions/download-artifact@v4
        with:
          name: operator-images
          path: operator-images
      - name: Validate native identities, streamed checksums and optional signed feed
        env:
          COMPANION_SIGNED_RELEASE: ${{ vars.COMPANION_SIGNED_RELEASE == 'true' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          VERSION=$(tr -d '[:space:]' < VERSION)
          signed=""
          if [ "$COMPANION_SIGNED_RELEASE" = true ]; then signed="--signed"; fi
          node desktop/scripts/collect-release.cjs --installers installers \
            --images operator-images/operator-images.json --output release-assets \
            --version "$VERSION" --sha "$GITHUB_SHA" $signed
      - name: Publish only after all platform builds and Docker lifecycle pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(tr -d '[:space:]' < VERSION)
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --verify-tag --title "Printer’s Companion $VERSION" \
            --notes-file "docs/releases/v$VERSION.md"
