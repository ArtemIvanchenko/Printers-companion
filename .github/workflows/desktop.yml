name: Desktop test packages

# Explicit, unsigned test packages. This workflow never changes main, publishes
# a GitHub Release, uploads a public updater feed or uses signing secrets.
on:
  workflow_call:
    inputs:
      images_artifact:
        description: Verified image manifest from the calling release build
        type: string
        default: ''
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - 'core/updating/**'
      - 'core/maintenance.py'
      - 'scripts/maintenance/desktop_entry.py'
      - 'checks/updating/**'
      - 'docker-compose.yml'
      - 'deploy/nas/docker-compose.operator.yml'
      - '.github/workflows/desktop.yml'
  push:
    branches: ['codex/desktop-app']

permissions:
  contents: read

concurrency:
  group: desktop-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
          - os: windows-2025
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build/test tools, not production analytics dependencies
        run: python -m pip install -r desktop/requirements-build.txt pytest starlette
      - name: Install locked desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Host protocol, preservation and rollback tests
        env:
          APP_ENV: test
          PYTHONPATH: .
        run: python -m pytest checks/updating -q -o addopts= --tb=short
      - name: Native boundary and update-controller tests
        working-directory: desktop
        run: npm test
      - name: Download exact release image manifest
        if: inputs.images_artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.images_artifact }}
          path: ${{ runner.temp }}/operator-images
      - name: Bundle verified non-secret resources
        working-directory: desktop
        # A clean test commit has verifiable identity, but no signed channel.
        shell: bash
        run: |
          if [ -n "${{ inputs.images_artifact }}" ]; then
            npm run resources -- --development --images "$RUNNER_TEMP/operator-images/operator-images.json"
          else
            npm run resources -- --development
          fi
      - name: Freeze the standard-library-only host executable
        working-directory: desktop
        run: npm run host
      - name: Exercise the frozen host without Docker/NAS
        working-directory: desktop
        run: node scripts/smoke-host.cjs
      - name: Package Mac
        if: runner.os == 'macOS'
        working-directory: desktop
        run: npm run dist:mac -- --${{ matrix.arch }}
      - name: Package Windows
        if: runner.os == 'Windows'
        working-directory: desktop
        run: npm run dist:win
      - name: Smoke packaged Mac, no Docker or operator data
        if: runner.os == 'macOS'
        shell: bash
        run: |
          export PRINTER_COMPANION_SMOKE_DIR="$RUNNER_TEMP/companion-smoke"
          mkdir -p "$PRINTER_COMPANION_SMOKE_DIR"
          native="desktop/dist/mac"
          if [ "${{ matrix.arch }}" = arm64 ]; then native="$native-arm64"; fi
          "$native/Printer’s Companion Test.app/Contents/MacOS/Printer’s Companion Test" --smoke
          test -s "$PRINTER_COMPANION_SMOKE_DIR/desktop.png"
      - name: Smoke packaged Windows, no Docker or operator data
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PRINTER_COMPANION_SMOKE_DIR = Join-Path $env:RUNNER_TEMP 'companion-smoke'
          New-Item -ItemType Directory -Path $env:PRINTER_COMPANION_SMOKE_DIR -Force | Out-Null
          $companion = Join-Path $pwd "desktop/dist/win-unpacked/Printer’s Companion Test.exe"
          $process = Start-Process -FilePath $companion -ArgumentList '--smoke' -PassThru
          if (-not $process.WaitForExit(60000)) { throw 'Desktop smoke timed out' }
          if ($process.ExitCode -ne 0) { throw 'Desktop smoke failed' }
          if (-not (Test-Path (Join-Path $env:PRINTER_COMPANION_SMOKE_DIR 'desktop.png'))) { throw 'No window screenshot' }
      - name: Upload test installers and evidence
        uses: actions/upload-artifact@v4
        with:
          name: companion-test-${{ matrix.os }}-${{ matrix.arch }}-${{ github.sha }}
          if-no-files-found: error
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
            desktop/runtime-resources/runtime-manifest.json
            ${{ runner.temp }}/companion-smoke/desktop.png
  docker-lifecycle:
    # Linux is only the internal container environment, not a desktop target.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Actual Docker freeze, switch and recovery in an isolated fixture
        env:
          COMPANION_DOCKER_CHECKS: '1'
          PYTHONPATH: .
        run: python -m pytest checks/updating/test_docker_lifecycle.py -q -o addopts= --tb=short
