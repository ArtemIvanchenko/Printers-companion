name: Desktop packages

# Default builds are unsigned. Only the calling tag release can explicitly opt
# into signing. Builders never publish; the final release job owns publication.
on:
  workflow_call:
    inputs:
      signed_release:
        description: Explicit signed channel, only after signing identities are configured
        type: boolean
        default: false
      images_artifact:
        description: Verified image manifest from the calling release build
        type: string
        default: ''
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - 'core/updating/**'
      - 'core/maintenance.py'
      - 'scripts/maintenance/desktop_entry.py'
      - 'checks/updating/**'
      - 'docker-compose.yml'
      - 'deploy/nas/docker-compose.operator.yml'
      - '.github/workflows/desktop.yml'
  push:
    branches: ['codex/desktop-app']

permissions:
  contents: read

concurrency:
  group: desktop-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
          - os: windows-2025
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build/test tools, not production analytics dependencies
        run: python -m pip install -r desktop/requirements-build.txt pytest starlette
      - name: Install locked desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Host protocol, preservation and rollback tests
        env:
          APP_ENV: test
          PYTHONPATH: .
        run: python -m pytest checks/updating -q -o addopts= --tb=short
      - name: Native boundary and update-controller tests
        working-directory: desktop
        run: npm test
      - name: Download exact release image manifest
        if: inputs.images_artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.images_artifact }}
          path: ${{ runner.temp }}/operator-images
      - name: Bundle verified non-secret resources
        working-directory: desktop
        shell: bash
        env:
          COMPANION_SIGNED_RELEASE: ${{ inputs.signed_release && 'true' || 'false' }}
        run: |
          mode="--development"
          if [ "$COMPANION_SIGNED_RELEASE" = true ]; then
            test "$GITHUB_REF" = "refs/tags/v$(tr -d '[:space:]' < ../VERSION)"
            test -n "${{ inputs.images_artifact }}"
            mode=""
          fi
          if [ -n "${{ inputs.images_artifact }}" ]; then
            npm run resources -- $mode --images "$RUNNER_TEMP/operator-images/operator-images.json"
          else
            npm run resources -- --development
          fi
      - name: Freeze the host executable with bundled public CA certificates
        working-directory: desktop
        run: npm run host
      - name: Exercise the frozen host without Docker/NAS
        working-directory: desktop
        run: node scripts/smoke-host.cjs
      - name: Package Mac
        if: runner.os == 'macOS'
        working-directory: desktop
        env:
          CSC_LINK: ${{ inputs.signed_release && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ inputs.signed_release && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ inputs.signed_release && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ inputs.signed_release && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ inputs.signed_release && secrets.APPLE_TEAM_ID || '' }}
          APPLE_API_KEY: ${{ inputs.signed_release && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_ID: ${{ inputs.signed_release && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ inputs.signed_release && secrets.APPLE_API_ISSUER || '' }}
          APPLE_KEYCHAIN_PROFILE: ${{ inputs.signed_release && secrets.APPLE_KEYCHAIN_PROFILE || '' }}
        run: npm run dist:mac -- --${{ matrix.arch }}
      - name: Package Windows
        if: runner.os == 'Windows'
        working-directory: desktop
        env:
          CSC_LINK: ${{ inputs.signed_release && secrets.WIN_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ inputs.signed_release && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          COMPANION_PUBLISHER_NAME: ${{ inputs.signed_release && secrets.COMPANION_PUBLISHER_NAME || '' }}
        run: npm run dist:win
      - name: Smoke packaged Mac, no Docker or operator data
        if: runner.os == 'macOS'
        shell: bash
        run: |
          export PRINTER_COMPANION_SMOKE_DIR="$RUNNER_TEMP/companion-smoke"
          mkdir -p "$PRINTER_COMPANION_SMOKE_DIR"
          native="desktop/dist/mac"
          if [ "${{ matrix.arch }}" = arm64 ]; then native="$native-arm64"; fi
          companion="${{ inputs.signed_release && 'Printer’s Companion' || 'Printer’s Companion Test' }}"
          "$native/$companion.app/Contents/MacOS/$companion" --smoke
          test -s "$PRINTER_COMPANION_SMOKE_DIR/desktop.png"
      - name: Smoke packaged Windows, no Docker or operator data
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PRINTER_COMPANION_SMOKE_DIR = Join-Path $env:RUNNER_TEMP 'companion-smoke'
          New-Item -ItemType Directory -Path $env:PRINTER_COMPANION_SMOKE_DIR -Force | Out-Null
          $name = "${{ inputs.signed_release && 'Printer’s Companion' || 'Printer’s Companion Test' }}"
          $companion = Join-Path $pwd "desktop/dist/win-unpacked/$name.exe"
          $process = Start-Process -FilePath $companion -ArgumentList '--smoke' -PassThru
          if (-not $process.WaitForExit(60000)) { throw 'Desktop smoke timed out' }
          if ($process.ExitCode -ne 0) { throw 'Desktop smoke failed' }
          if (-not (Test-Path (Join-Path $env:PRINTER_COMPANION_SMOKE_DIR 'desktop.png'))) { throw 'No window screenshot' }
      - name: Upload native installers and evidence, never publish here
        uses: actions/upload-artifact@v4
        with:
          name: companion-${{ inputs.signed_release && 'signed' || 'test' }}-${{ matrix.os }}-${{ matrix.arch }}-${{ github.sha }}
          if-no-files-found: error
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
            ${{ inputs.signed_release && 'desktop/dist/*.blockmap' || '' }}
            ${{ inputs.signed_release && 'desktop/dist/latest*.yml' || '' }}
            desktop/runtime-resources/runtime-manifest.json
            ${{ runner.temp }}/companion-smoke/desktop.png
  docker-lifecycle:
    # Linux is only the internal container environment, not a desktop target.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Actual Docker freeze, switch and recovery in an isolated fixture
        env:
          COMPANION_DOCKER_CHECKS: '1'
          PYTHONPATH: .
        run: python -m pytest checks/updating/test_docker_lifecycle.py -q -o addopts= --tb=short
