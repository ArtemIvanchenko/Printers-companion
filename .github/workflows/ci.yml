name: CI

# A published version must pass the application CI at its exact SHA. Desktop
# packages have separate host/platform checks; main is not an update channel.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Must match Dockerfile.base.
          python-version: "3.11"
          cache: pip

      - name: Check generated dependency tiers (stdlib only)
        run: python scripts/export_requirements.py --check

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.base.txt
          pip install -r requirements.analytics.txt
          pip install -r requirements.heavy.txt
          pip install -r requirements.dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        env:
          # SQLite keeps CI free of service containers; conftest creates the
          # schema. See the migrations job for Alembic coverage.
          DATABASE_URL: sqlite:////tmp/pla-ci.db
          APP_ENV: test
        run: pytest tests/ checks/updating/ -q

  migrations:
    # Guards drift the test suite cannot see: conftest builds its schema with
    # create_all() from the ORM models, so a migration that fails to reproduce
    # those models passes every test and breaks on a real upgrade.
    #
    # This is strict now that 0001 carries an explicit frozen snapshot instead
    # of calling create_all() — the chain no longer defines itself in terms of
    # the models it is checked against. It caught the nullability mismatch that
    # migration 0006 fixes.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: printer_logs
          POSTGRES_USER: printer_logs
          POSTGRES_PASSWORD: ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U printer_logs"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.base.txt

      - name: Run migrations against a real PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://printer_logs:ci-password@localhost:5432/printer_logs
          APP_ENV: test
        run: alembic upgrade head

      - name: Fail if the ORM models drift from the migrations
        env:
          DATABASE_URL: postgresql+psycopg://printer_logs:ci-password@localhost:5432/printer_logs
          APP_ENV: test
          # Running a file inside scripts/ puts scripts/ on sys.path, not the
          # repo root, so the project packages would not import.
          PYTHONPATH: .
        run: python scripts/check_migration_drift.py

  container-smoke:
    # Actual packaged API startup, not imports from the runner's checkout.
    # This deliberately tests degraded readiness with no NAS/Redis present;
    # unit tests cover ready probes, migrations above cover real PostgreSQL.
    # It is not an operator-stack / worker end-to-end health assertion.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker
      - name: Build the shared base
        run: docker build -f Dockerfile.base -t ghcr.io/artemivanchenko/printers-companion:base .
      - name: Build the real API image with release identity
        run: |
          docker build -f Dockerfile.api -t companion-smoke:ci \
            --build-arg "APP_VERSION=$(tr -d '[:space:]' < VERSION)" \
            --build-arg "GIT_COMMIT=$GITHUB_SHA" \
            --build-arg "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg SOURCE_STATE=clean .
      - name: Initialize isolated SQLite through Alembic
        run: |
          docker volume create companion-smoke-data
          docker run --rm --user 0 --volume companion-smoke-data:/smoke \
            -e APP_ENV=test -e DATABASE_URL=sqlite:////smoke/test.sqlite \
            --entrypoint sh companion-smoke:ci \
            -c 'alembic upgrade head && chown -R 10001 /smoke'
      - name: Start API without startup imports or external inference
        run: |
          docker run -d --name companion-api-smoke --read-only \
            --tmpfs /tmp:rw,size=256m,mode=1777 \
            --volume companion-smoke-data:/smoke -p 127.0.0.1:8000:8000 \
            -e APP_ENV=test -e DATABASE_URL=sqlite:////smoke/test.sqlite \
            -e REDIS_URL=redis://127.0.0.1:1/0 -e MINIO_ENDPOINT=127.0.0.1:2 \
            -e NAS_OUTBOX_PATH=/tmp/nas-outbox -e OPERATOR_INSTANCE_FILE=/tmp/instance-id \
            -e STARTUP_IMPORT_ENABLED=false -e LLM_PROVIDER=null \
            companion-smoke:ci uvicorn api.main:app --host 0.0.0.0 --port 8000
      - name: Verify baked revision, liveness and honest degraded readiness
        run: |
          python - <<'PY'
          import json, os, time
          from urllib.error import HTTPError, URLError
          from urllib.request import urlopen
          deadline = time.monotonic() + 90
          while True:
              try:
                  with urlopen('http://127.0.0.1:8000/health', timeout=3) as response:
                      live = json.load(response)
                  break
              except (OSError, URLError):
                  if time.monotonic() >= deadline:
                      raise
                  time.sleep(2)
          assert live['status'] == 'ok'
          assert live['build']['git_sha'] == os.environ['GITHUB_SHA']
          assert live['build']['source_state'] == 'clean'
          try:
              urlopen('http://127.0.0.1:8000/health/ready', timeout=15)
              raise AssertionError('Missing backends must not produce green readiness')
          except HTTPError as error:
              assert error.code == 503
              report = json.load(error)
          assert report['scope'] == 'api_dependencies'
          assert report['checks']['database'] and report['checks']['schema']
          assert report['checks']['redis'] is False and report['checks']['minio'] is False
          assert report['build'] == live['build']
          assert all(value['status'] == 'unknown' for value in report['capabilities'].values())
          PY
      - name: Container diagnostics
        if: always()
        run: docker logs companion-api-smoke 2>&1 || true
      - name: Remove only CI smoke resources
        if: always()
        run: |
          docker rm -f companion-api-smoke 2>/dev/null || true
          docker volume rm companion-smoke-data 2>/dev/null || true
