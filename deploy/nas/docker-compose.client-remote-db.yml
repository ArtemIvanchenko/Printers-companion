# Оверрайд для клиентских ПК на момент переключения на общий NAS.
# Применять ТОЛЬКО когда postgres/minio уже подняты и наполнены данными на NAS.
#
# Использование:
#   docker compose -f docker-compose.yml -f deploy/nas/docker-compose.client-remote-db.yml up -d
#
# Убирает локальные контейнеры postgres/minio и снимает зависимость от них
# у остальных сервисов, чтобы приложение шло за данными на NAS (см. .env: DATABASE_URL, MINIO_ENDPOINT).

services:
  postgres:
    deploy:
      replicas: 0

  minio:
    deploy:
      replicas: 0

  api:
    depends_on: {}

  worker:
    depends_on: {}

  scheduler:
    depends_on: {}

  mcp:
    depends_on: {}
