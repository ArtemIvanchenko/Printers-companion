[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "printer-log-analytics"
version = "1.5.0"  # keep in sync with the VERSION file (single source of truth)
description = "Extensible industrial log analytics platform for metal 3D printers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "polars>=0.20",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
  "redis>=5.0",
  "minio>=7.2",
  "plotly>=5.22",
  "networkx>=3.3",
  "scipy>=1.13",
  "statsmodels>=0.14",
  "scikit-learn>=1.4",
  "httpx>=0.27",
  "PyYAML>=6.0",
  "python-multipart>=0.0.9",
  "typer>=0.12",
  "charset-normalizer>=3.3",
  "apscheduler>=3.10",
  "watchdog>=4.0",
  "tenacity>=8.0",
  "trimesh>=4.0",
  "shapely>=2.0",
  "PythonSLM>=0.6",
  "pymeshfix>=0.17",
  "ruptures>=1.1",
  "lightgbm>=4.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0.0"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
pla = "cli.main:app"

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = ["."]
include = [
  "api*",
  "cli*",
  "worker*",
  "scheduler*",
  "core*",
  "domain*",
  "parsers*",
  "profiles*",
  "analytics*",
  "operator_journal*",
  "background_reanalysis*",
  "reporting*",
  "storage*",
  "mcp_server*",
]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Stated explicitly rather than relying on ruff's defaults: 0.16 widened them
# and CI (which installed ruff unpinned) went from 0 findings to 620 — mostly
# BLE001 against best-effort handlers this codebase catches broadly on purpose.
# With the set pinned here, upgrading ruff cannot silently change what is
# enforced; adding a rule becomes a deliberate edit.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Standalone demo scripts, run directly and not imported by the app: they set
# up sys.path before importing project modules, so E402 is intentional there.
"experiments/*" = ["E402"]
